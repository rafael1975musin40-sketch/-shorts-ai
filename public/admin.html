<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHORTS AI — Admin</title>
<style>:root{--ink:#17121f;--pink:#ff2fb3;--purple:#7c3aed;--cyan:#25d9ff;--lime:#c8ff35;--yellow:#ffe44d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#fff 0%,#f2edff 45%,#e8fbff 100%);color:var(--ink)}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.logo{font-size:28px;font-weight:1000}.logo span{background:var(--pink);border:3px solid var(--ink);border-radius:10px;padding:3px 8px}.btn{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:9px 13px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:18px;box-shadow:7px 7px 0 var(--ink)}.stat b{font-size:34px;display:block}.stat small{font-weight:800}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;margin-top:22px}.card h2{margin:0 0 14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:2px solid #eee;font-size:14px}th{font-size:12px;text-transform:uppercase}.badge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:4px 8px;font-weight:900}.pro{background:var(--yellow)}.free{background:#eee}.actions{display:flex;gap:6px}.mini{padding:7px 9px;border:2px solid var(--ink);border-radius:9px;background:var(--lime);font-weight:900;cursor:pointer}.mini.red{background:#ffb3dd}.login{max-width:450px;margin:100px auto}.input{width:100%;padding:13px;border:3px solid var(--ink);border-radius:12px;margin:6px 0 12px;font-size:16px}.hidden{display:none}.activity{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:80px 1fr 45px;gap:8px;align-items:center;font-size:12px;font-weight:800}.bar{height:16px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan));border:2px solid var(--ink);border-radius:99px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:500px){.stats{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap">
<div id="login" class="login card"><h1>🛠 Admin SHORTS AI</h1><p>Вход администратора</p><input class="input" id="email" placeholder="admin@example.com" type="email"><input class="input" id="pass" placeholder="Пароль" type="password"><button class="btn" id="loginBtn">Войти</button><p id="err"></p></div>
<div id="app" class="hidden"><div class="top"><div class="logo"><span>▶</span> SHORTS AI <small>ADMIN</small></div><button class="btn" id="logout">Выйти</button></div><div class="stats"><div class="card stat"><b id="users">0</b><small>👥 Пользователей</small></div><div class="card stat"><b id="pro">0</b><small>💎 Активный PRO</small></div><div class="card stat"><b id="revenue">0 ₽</b><small>💰 Выручка</small></div><div class="card stat"><b id="ai">0</b><small>🤖 AI-действий</small></div></div><div class="grid"><div class="card"><h2>👥 Пользователи</h2><div class="table-wrap"><table><thead><tr><th>Email</th><th>Тариф</th><th>Создан</th><th>Действия</th></tr></thead><tbody id="usersTable"></tbody></table></div></div><div class="card"><h2>📈 AI активность</h2><div id="activity" class="activity"></div><hr><p><b>Новые сегодня:</b> <span id="newToday">0</span></p><p><b>Платежей:</b> <span id="payments">0</span></p></div></div></div></div>
<script>let t=localStorage.getItem('adminToken')||'';const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pass').value})});t=d.token;localStorage.setItem('adminToken',t);await load()}catch(e){$('err').textContent='⚠️ '+e.message}}async function load(){try{const s=await api('/api/admin/stats'),u=await api('/api/admin/users'),a=await api('/api/admin/activity');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('users').textContent=s.users.total;$('pro').textContent=s.users.pro;$('revenue').textContent=Number(s.payments.revenue).toLocaleString('ru-RU')+' ₽';$('ai').textContent=s.ai.total;$('newToday').textContent=s.users.new_today;$('payments').textContent=s.payments.payments;renderUsers(u);renderActivity(a)}catch(e){t='';localStorage.removeItem('adminToken');$('err').textContent='⚠️ '+e.message;$('login').classList.remove('hidden');$('app').classList.add('hidden')}}function renderUsers(us){$('usersTable').innerHTML=us.map(u=>{const pro=u.plan==='pro'&&u.pro_until&&new Date(u.pro_until)>new Date();return `<tr><td>${esc(u.email)}</td><td><span class="badge ${pro?'pro':'free'}">${pro?'💎 PRO':'FREE'}</span></td><td>${new Date(u.created_at).toLocaleDateString('ru-RU')}</td><td><div class="actions">${pro?`<button class="mini red" onclick="free('${u.id}')">Free</button>`:`<button class="mini" onclick="give('${u.id}')">+30д PRO</button>`}</div></td></tr>`}).join('')}function renderActivity(a){const max=Math.max(1,...a.map(x=>x.count));$('activity').innerHTML=a.map(x=>`<div class="barrow"><span>${new Date(x.day).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})} ${x.action_type}</span><div class="bar" style="width:${Math.max(8,x.count/max*100)}%"></div><b>${x.count}</b></div>`).join('')}async function give(id){try{await api('/api/admin/users/'+id+'/pro',{method:'POST',body:JSON.stringify({days:30})});load()}catch(e){alert(e.message)}}async function free(id){try{await api('/api/admin/users/'+id+'/free',{method:'POST'});load()}catch(e){alert(e.message)}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('loginBtn').onclick=login;$('logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch{}t='';localStorage.removeItem('adminToken');location.reload()};if(t)load()</script></body></html>
